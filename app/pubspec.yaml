name: midas
description: "Midas - the all-in-one media downloader. Everything it touches turns to gold."
publish_to: "none"
version: 1.2.0+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.5.0
  web_socket_channel: ^3.0.0
  window_manager: ^0.4.2
  flutter_animate: ^4.5.0
  animations: ^2.0.11
  shimmer: ^3.0.0
  file_picker: ^8.0.6

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    # Display / wordmark face (open-license Bruney stand-in).
    # Own Bruney? Drop Bruney.otf into assets/fonts/, add a family entry
    # named "Bruney", and set MidasTheme.displayFamily = "Bruney".
    - family: Cormorant
      fonts:
        - asset: assets/fonts/Cormorant[wght].ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope[wght].ttf
