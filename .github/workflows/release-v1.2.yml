# Builds Midas-Setup.msi on a Windows runner and publishes the
# "Midas v1.2" release with the installer attached.
#
# An .msi can only be produced on Windows (WiX + the Flutter Windows
# toolchain), which is why this job exists instead of building locally on
# Linux. Start it from the Actions tab (Run workflow) or by pushing the
# v1.2.0 tag.
name: Release Midas v1.2 (.msi)

on:
  workflow_dispatch:
  push:
    tags:
      - "v1.2.0"

permissions:
  contents: write

jobs:
  build-msi:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Flutter (Windows desktop)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Engine regression suite (offline)
        working-directory: engine
        run: python tests/stress_test.py

      # build_msi.bat calls build.bat when dist\Midas is missing, and both
      # scripts download their own portable dependencies (yt-dlp, ffmpeg,
      # Deno, fonts, WiX). windows-latest already ships the MSVC build
      # tools Flutter needs.
      - name: Build Midas-Setup.msi
        shell: cmd
        run: call build_msi.bat

      - name: Upload the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Midas-Setup-msi
          path: dist/Midas-Setup.msi
          if-no-files-found: error

      - name: Publish the Midas v1.2 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: Midas v1.2
          body_path: docs/RELEASE_NOTES_v1.2.md
          draft: false
          prerelease: false
          files: dist/Midas-Setup.msi
